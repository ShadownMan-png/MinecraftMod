plugins {
    id 'forge'
    version = "1.0.0"
    group = "com.tufabrica.ratmod"
    archivesBaseName = "enhanced-utilities"

// Configuración multi-versión
def mc_version = project.hasProperty('mc_version') ? project.mc_version : '1.20.1'
def forge_version = project.hasProperty('forge_version') ? project.forge_version : '47.2.0'

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    mappings channel: 'official', version: mc_version
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                ratmod {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
}

jar {
    manifest {
        attributes([
            "Specification-Title": "ratmod",
            "Specification-Vendor": "ratmod",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "ratmod",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
